<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            background: #111;
            color: #fff;
        }
        nav {
            display: flex;
            gap: 4px;
            padding: 12px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
        }
        nav a.active {
            background: #333;
        }
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 56px);
        }
        #qrcode {
            padding: 20px;
            background: #fff;
            border-radius: 8px;
        }
        main {
            flex-direction: column;
            gap: 16px;
        }
        #lock-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        #lock-icon {
            font-size: 3rem;
        }
        #lock-label {
            font-size: 1.1rem;
            color: #aaa;
        }
        #countdown {
            font-size: 2.5rem;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="qr.html" class="active">QR</a>
    </nav>
    <main>
        <div id="qrcode" class="hidden"></div>
        <div id="lock-screen" class="hidden">
            <div id="lock-icon">🔒</div>
            <div id="lock-label">Unlocks in</div>
            <div id="countdown">--:--:--</div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        // The QR payload is not stored here. The server only hands it out
        // during the unlock window, based on its own clock.
        const WORKER_URL = "https://unbeatable-qr.masudarahman02.workers.dev";

        const qrEl = document.getElementById("qrcode");
        const lockEl = document.getElementById("lock-screen");
        const labelEl = document.getElementById("lock-label");
        const countdownEl = document.getElementById("countdown");
        let target = null;

        function pad(n) {
            return n.toString().padStart(2, "0");
        }

        function showLock(unlockAt) {
            qrEl.classList.add("hidden");
            qrEl.innerHTML = "";
            lockEl.classList.remove("hidden");
            labelEl.textContent = "Unlocks in";
            target = unlockAt;
        }

        function showQr(payload, relockAt) {
            lockEl.classList.add("hidden");
            qrEl.innerHTML = "";
            qrEl.classList.remove("hidden");
            new QRCode(qrEl, {
                text: payload,
                width: 300,
                height: 300,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
            target = relockAt;
        }

        async function check() {
            target = null;
            try {
                const res = await fetch(`${WORKER_URL}/qr`, { cache: "no-store" });
                const data = await res.json();
                if (data.unlocked) {
                    showQr(data.payload, data.relockAt);
                } else {
                    showLock(data.unlockAt);
                }
            } catch (err) {
                qrEl.classList.add("hidden");
                lockEl.classList.remove("hidden");
                labelEl.textContent = "Couldn't reach server";
                countdownEl.textContent = "--:--:--";
                setTimeout(check, 30000);
            }
        }

        function tick() {
            if (target === null) return;
            const diff = target - Date.now();
            if (diff <= 0) {
                check();
                return;
            }
            const hours = Math.floor(diff / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);
            const secs = Math.floor((diff % 60000) / 1000);
            countdownEl.textContent = `${pad(hours)}:${pad(mins)}:${pad(secs)}`;
        }

        check();
        setInterval(tick, 1000);
    </script>
</body>
</html>
