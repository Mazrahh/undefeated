<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            background: #111;
            color: #fff;
        }
        nav {
            display: flex;
            gap: 4px;
            padding: 12px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
        }
        nav a.active {
            background: #333;
        }
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 56px);
        }
        #qrcode {
            padding: 20px;
            background: #fff;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="qr.html" class="active">QR</a>
    </nav>
    <main>
        <div id="qrcode"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "f9a2e4c7-3b81-4d6f-92ae-7c503d1b8e45",
            width: 300,
            height: 300,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
